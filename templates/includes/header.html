{% load static %}

<!-- Header Section -->

<header class="header d-flex justify-between align-center">

    <!-- Icons -->

    <div class="icons d-flex ">

        <!-- Basket -->
        <a href="#" class="d-flex position-relative">
            <span class="basket_items_nums d-inline-flex flex-center position-absolute">15</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-shopping-cart preview-icon">
                <path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18" />
                <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25" />
                <circle cx="18" cy="20" r="2" />
                <circle cx="8" cy="20" r="2" />
            </svg>
        </a>

        <!-- WishList -->
        <a href="#">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-heart preview-icon">
                <path
                    d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5" />
            </svg>
        </a>

        <!-- Account -->
        <a href="#">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-user preview-icon">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
        </a>
    </div>

    <!-- Searchbox -->

    <div class="searchbox d-flex flex-center">
        <form action="#" class="d-flex position-relative">

            <button type="submit" class="search_btn position-absolute d-inline-flex align-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-search preview-icon">
                    <path d="m21 21-4.34-4.34" />
                    <circle cx="11" cy="11" r="8" />
                </svg>
            </button>

            <input type="text" name="searchbox" placeholder=" جستجو میان محصولات ..." class="text-input">

        </form>
    </div>

    <!-- Logo -->
    <div class="d-flex">
        <a href="{% url 'website:index' %}" class="d-flex logo">
            <img src="{% static 'images/logo.png' %}" alt="pooshtan-logo">
        </a>
    </div>

</header>
